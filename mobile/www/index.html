<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SudoChatBot</title>
  <!--
    หน้านี้แสดงเฉพาะตอนเปิดแอปแล้วต่อเน็ตไม่ได้

    ทำไมต้องมี: Capacitor บังคับให้มี webDir เสมอ และถ้าปล่อยว่าง
    ผู้ใช้ที่เน็ตหลุดจะเจอหน้าขาวหรือหน้า error ของ WebView ซึ่งดูเหมือนแอปพัง
    หน้านี้บอกตรง ๆ ว่าเกิดอะไรขึ้นและให้ลองใหม่ได้

    ⚠️ ห้ามใส่ตรรกะบัญชีหรือข้อมูลใด ๆ ลงในไฟล์นี้
    ทุกอย่างต้องมาจาก server เท่านั้น (ดูเหตุผลใน capacitor.config.ts)
  -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      background: #fafafa; color: #171717;
      font-family: "IBM Plex Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 360px; text-align: center; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
      background: #0B6B4A; display: grid; place-items: center;
      color: #fff; font-size: 26px; font-weight: 700;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.7; color: #737373; margin: 0 0 24px; }
    button {
      width: 100%; min-height: 48px; border: 0; border-radius: 12px;
      background: #0B6B4A; color: #fff; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: transform .1s ease;
    }
    button:active { transform: scale(.97); }
    .hint { margin-top: 16px; font-size: 12px; color: #a3a3a3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">S</div>
    <h1>ต่ออินเทอร์เน็ตไม่ได้</h1>
    <p>
      แอปต้องใช้อินเทอร์เน็ตเพื่อดึงข้อมูลบัญชีล่าสุด<br />
      เช็คสัญญาณ Wi-Fi หรือเน็ตมือถือแล้วลองใหม่อีกครั้ง
    </p>
    <button onclick="location.replace('https://sudochatbot.online/dashboard')">ลองใหม่อีกครั้ง</button>
    <p class="hint">ข้อมูลของคุณปลอดภัยอยู่บนเซิร์ฟเวอร์ ไม่มีอะไรหาย</p>
  </div>
</body>
</html>
